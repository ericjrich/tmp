<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>American Roulette Tracker v1.9.4 Test</title>
<style>
:root{color-scheme:dark;--bg:#0c1013;--panel:#141a1f;--panel2:#1a2228;--text:#f4f7f8;--muted:#a8b2b8;--line:#2b363d;--red:#a71922;--black:#111;--green:#087b4f;--gold:#ffe08a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}.app{max-width:900px;margin:auto;padding:7px}.top{display:flex;align-items:center;justify-content:space-between;gap:7px;flex-wrap:wrap}.top h1{font-size:1rem;margin:0}.ver{font-size:.56em;border:1px solid #50606a;border-radius:999px;padding:2px 6px;color:#c6d1d7}.actions{display:flex;gap:4px}.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:8px;padding:6px 9px;cursor:pointer}.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px;margin-top:6px}.status{text-align:center;color:var(--muted);font-size:.63rem;margin-bottom:4px}.summary{display:grid;grid-template-columns:74px minmax(0,1fr);gap:3px 6px;align-items:center;border:1px solid #805f2780;background:linear-gradient(90deg,#2b2113,#171a1d);border-radius:7px;padding:5px 6px;margin-bottom:5px;font-size:.61rem}.sumlabel{color:#ffd98a;font-weight:900;font-size:.52rem;letter-spacing:.05em}.sumval{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:750}.sumval.muted{color:var(--muted)}
.zero{display:grid;grid-template-columns:repeat(2,1fr);gap:3px;margin-bottom:3px}.board{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}.num{position:relative;height:40px;border:1px solid #ffffff30;border-radius:7px;color:#fff;font-weight:850;font-size:.98rem;cursor:pointer;overflow:hidden}.num.red{background:linear-gradient(#bf222c,#8e1119)}.num.black{background:linear-gradient(#25282a,#090a0b)}.num.green{background:linear-gradient(#119966,#06633f)}.num.last{outline:2px solid #fff;outline-offset:1px}.num.opp1{border-color:#d9a443;box-shadow:0 0 7px #d990253f}.num.opp2{border-color:#ffc45d;box-shadow:0 0 11px #ff9b2d73}.num.opp3{border:2px solid var(--gold);box-shadow:0 0 15px #ff9910aa,0 0 7px #fff0b024 inset}.rank{position:absolute;left:2px;top:1px;z-index:3;min-width:17px;height:12px;line-height:11px;border-radius:999px;background:#5b3b09d9;border:1px solid #ffd270cc;color:#fff0c9;font-size:.43rem;font-weight:950}.cnt{position:absolute;right:3px;top:2px;font-size:.47rem;background:#0008;border-radius:999px;padding:1px 3px}.gap{position:absolute;left:3px;bottom:2px;font-size:.43rem;color:#ffffffc7}
.bets{display:grid;gap:3px;margin-top:5px}.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}.row6{display:grid;grid-template-columns:repeat(6,1fr);gap:2px}.bet{position:relative;min-height:37px;border:1px solid var(--line);border-radius:6px;background:#10161b;color:#fff;text-align:center;padding:4px 2px;font-weight:850;font-size:.61rem;overflow:hidden}.bet.redbet{background:linear-gradient(#771a21,#481015)}.bet.blackbet{background:linear-gradient(#26292c,#111315)}.bet.opp1{border-color:#c4933d88;box-shadow:0 0 7px #d9902530}.bet.opp2{border-color:#f0b956cc;background:#322617;box-shadow:0 0 10px #e7a73f55}.bet.opp3{border:2px solid var(--gold);background:#3a2b17;box-shadow:0 0 15px #ffae3d80}.betmeta{display:block;color:var(--muted);font-size:.45rem;font-weight:600;margin-top:2px}.betrank{position:absolute;right:2px;top:1px;color:#fff0c9;background:#6a450bbf;border:1px solid #ffd270aa;border-radius:999px;padding:0 3px;font-size:.43rem;line-height:12px}.note{text-align:center;color:var(--muted);font-size:.52rem;line-height:1.2;margin-top:4px}.note b{color:#ffd98a}.controls{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px;margin-top:5px}.controls input{min-width:0;background:#0f1418;color:#fff;border:1px solid var(--line);border-radius:7px;padding:7px 8px;font-size:16px}.history{display:flex;gap:4px;overflow:auto;padding:3px 0}.chip{flex:0 0 auto;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:.68rem;font-weight:800}.chip.red{background:#9d1820}.chip.black{background:#111}.chip.green{background:#087b4f}.why{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}.whyitem{border:1px solid var(--line);background:#0f1418;border-radius:7px;padding:5px}.whyitem b{font-size:.64rem}.whyitem p{margin:2px 0 0;color:var(--muted);font-size:.51rem;line-height:1.25}
@media(max-width:620px){.app{padding:4px}.panel{padding:4px}.top h1{font-size:.88rem}.actions .btn{font-size:.62rem;padding:5px 7px}.num{height:35px;font-size:.9rem}.bet{min-height:34px;font-size:.53rem}.row6 .bet{font-size:.45rem;padding-left:1px;padding-right:1px}.summary{font-size:.55rem;grid-template-columns:65px minmax(0,1fr)}.why{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
  <div class="top"><h1>American Roulette Tracker <span class="ver">v1.9.4 TEST</span></h1><div class="actions"><button class="btn" id="undo">Undo</button><button class="btn" id="export">Export</button><button class="btn" id="import">Import</button><button class="btn" id="clear">Clear</button></div></div>
  <div class="panel">
    <div class="status" id="status">0 spins</div>
    <div class="summary"><span class="sumlabel">BEST BETS</span><span class="sumval muted" id="topBets">Building sample…</span><span class="sumlabel">NUMBERS</span><span class="sumval muted" id="topNumbers">—</span></div>
    <div class="zero" id="zero"></div><div class="board" id="board"></div>
    <div class="bets" id="bets">
      <div class="row3"><button class="bet" data-family="Dozens" data-name="Dozen 1">1st 12<span class="betmeta"></span></button><button class="bet" data-family="Dozens" data-name="Dozen 2">2nd 12<span class="betmeta"></span></button><button class="bet" data-family="Dozens" data-name="Dozen 3">3rd 12<span class="betmeta"></span></button></div>
      <div class="row3"><button class="bet" data-family="Columns" data-name="Column 1">COL 1<span class="betmeta"></span></button><button class="bet" data-family="Columns" data-name="Column 2">COL 2<span class="betmeta"></span></button><button class="bet" data-family="Columns" data-name="Column 3">COL 3<span class="betmeta"></span></button></div>
      <div class="row6"><button class="bet" data-family="Range" data-name="1–18">1–18<span class="betmeta"></span></button><button class="bet" data-family="Parity" data-name="Even">EVEN<span class="betmeta"></span></button><button class="bet redbet" data-family="Color" data-name="Red">RED<span class="betmeta"></span></button><button class="bet blackbet" data-family="Color" data-name="Black">BLACK<span class="betmeta"></span></button><button class="bet" data-family="Parity" data-name="Odd">ODD<span class="betmeta"></span></button><button class="bet" data-family="Range" data-name="19–36">19–36<span class="betmeta"></span></button></div>
    </div>
    <div class="note"><b>Gold ★</b> uses the original v1.9.3 opportunity logic. Number ranks secretly use BOTH: latest 100 board spins + latest 20 physical-wheel spins (±2 sector). The wheel itself is hidden.</div>
    <div class="controls"><input id="quick" inputmode="numeric" autocomplete="off" placeholder="00, 0–36 then Enter"><button class="btn" id="add">Add</button></div>
  </div>
  <div class="panel"><b style="font-size:.68rem">Recent results</b><div class="history" id="history"></div></div>
  <div class="panel"><div class="why" id="why"></div></div>
</div>
<script>
(()=>{'use strict';
const STORAGE_KEY='ejr-american-roulette-tracker-v1',RED=new Set([1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36].map(String)),BLACK=new Set([2,4,6,8,10,11,13,15,17,20,22,24,26,28,29,31,33,35].map(String)),POCKETS=['0','00',...Array.from({length:36},(_,i)=>String(i+1))],WHEEL_ORDER=['0','28','9','26','30','11','7','20','32','17','5','22','34','15','3','24','36','13','1','00','27','10','25','29','12','8','19','31','18','6','21','33','16','4','23','35','14','2'],WHEEL_INDEX=new Map(WHEEL_ORDER.map((p,i)=>[p,i])),WHEEL_WINDOW=20,BOARD_WINDOW=100,FAIR=1/38,wheelRadius=2;
let outcomes=[];const $=id=>document.getElementById(id),el={zero:$('zero'),board:$('board'),bets:$('bets'),status:$('status'),topBets:$('topBets'),topNumbers:$('topNumbers'),history:$('history'),why:$('why'),quick:$('quick')};
function pocketClass(v){return v==='0'||v==='00'?'green':RED.has(v)?'red':'black'}function valid(v){return /^(00|0|[1-9]|[12][0-9]|3[0-6])$/.test(String(v).trim())}function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(outcomes))}function load(){try{const x=JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]');if(Array.isArray(x))outcomes=x.map(String).filter(valid)}catch{}}function add(v){v=String(v).trim();if(!valid(v)){el.quick.focus();return}outcomes.push(v);save();render();el.quick.value=''}function undo(){if(outcomes.length){outcomes.pop();save();render()}}function countsFor(seq=outcomes){const m=Object.fromEntries(POCKETS.map(p=>[p,0]));for(const v of seq)m[v]++;return m}function gapFor(p){for(let i=outcomes.length-1,g=0;i>=0;i--,g++)if(outcomes[i]===p)return g;return outcomes.length}function boardOutcomes(){return outcomes.slice(-BOARD_WINDOW)}
function normalCDF(x){const t=1/(1+0.2316419*Math.abs(x)),d=0.3989423*Math.exp(-x*x/2);let p=d*t*(0.3193815+t*(-0.3565638+t*(1.781478+t*(-1.821256+t*1.330274))));p=1-p;return x>=0?p:1-p}function binomZ(k,n,p){if(!n)return 0;const e=n*p,v=n*p*(1-p);return v>0?(k-e)/Math.sqrt(v):0}function pTwo(z){return Math.max(0,Math.min(1,2*(1-normalCDF(Math.abs(z)))))}function holm(items){const sorted=items.map((x,i)=>({...x,_i:i})).sort((a,b)=>a.p-b.p),m=sorted.length;let prev=0;sorted.forEach((x,i)=>{const adj=Math.min(1,(m-i)*x.p);x.pAdj=Math.max(prev,adj);prev=x.pAdj});const out=new Array(m);sorted.forEach(x=>out[x._i]=x);return out}
function categoryDefs(){return[{family:'Color',name:'Red',p:18/38,test:v=>RED.has(v)},{family:'Color',name:'Black',p:18/38,test:v=>BLACK.has(v)},{family:'Parity',name:'Odd',p:18/38,test:v=>v!=='0'&&v!=='00'&&(+v%2===1)},{family:'Parity',name:'Even',p:18/38,test:v=>v!=='0'&&v!=='00'&&(+v%2===0)},{family:'Range',name:'1–18',p:18/38,test:v=>+v>=1&&+v<=18},{family:'Range',name:'19–36',p:18/38,test:v=>+v>=19&&+v<=36},{family:'Dozens',name:'Dozen 1',p:12/38,test:v=>+v>=1&&+v<=12},{family:'Dozens',name:'Dozen 2',p:12/38,test:v=>+v>=13&&+v<=24},{family:'Dozens',name:'Dozen 3',p:12/38,test:v=>+v>=25&&+v<=36},{family:'Columns',name:'Column 1',p:12/38,test:v=>v!=='0'&&v!=='00'&&((+v-1)%3===0)},{family:'Columns',name:'Column 2',p:12/38,test:v=>v!=='0'&&v!=='00'&&((+v-2)%3===0)},{family:'Columns',name:'Column 3',p:12/38,test:v=>v!=='0'&&v!=='00'&&(+v%3===0)},{family:'Zeros',name:'0',p:1/38,test:v=>v==='0'},{family:'Zeros',name:'00',p:1/38,test:v=>v==='00'}]}
function categoryStats(seq=boardOutcomes()){const n=seq.length,raw=categoryDefs().map(d=>{const k=seq.reduce((a,v)=>a+(d.test(v)?1:0),0),z=binomZ(k,n,d.p);return{...d,k,n,expected:n*d.p,z,p:pTwo(z)}});return holm(raw)}
function wheelSector(center,r=wheelRadius){const i=WHEEL_INDEX.get(center);if(i===undefined)return[];const a=[];for(let d=-r;d<=r;d++)a.push(WHEEL_ORDER[(i+d+38)%38]);return a}
function wheelModel(){const recent=outcomes.slice(-WHEEL_WINDOW),n=recent.length,sectorSize=wheelRadius*2+1,p=sectorSize/38,confidence=n?Math.min(1,Math.sqrt(n/20)):0;const centers=WHEEL_ORDER.map(center=>{const members=wheelSector(center),set=new Set(members),k=recent.reduce((a,v)=>a+(set.has(v)?1:0),0),z=binomZ(k,n,p),score=Math.max(0,z-.30)*confidence;return{center,members,k,n,p,expected:n*p,z,score}}).sort((a,b)=>b.score-a.score||b.k-a.k||WHEEL_INDEX.get(a.center)-WHEEL_INDEX.get(b.center)),best=centers[0],support=new Map(POCKETS.map(p=>[p,0]));for(const x of centers)for(const p of x.members)support.set(p,Math.max(support.get(p)||0,x.score));return{recent,n,sectorSize,p,confidence,centers,best,support}}
function opportunityModel(){const sample=boardOutcomes(),n=sample.length,stats=categoryStats(sample),byKey=new Map(),familyCandidates=[];for(const family of ['Color','Parity','Range','Dozens','Columns']){const g=stats.filter(x=>x.family===family),q=g.length;if(q<2)continue;const total=g.reduce((a,x)=>a+x.k,0);if(total<12)continue;const min=Math.min(...g.map(x=>x.k)),p=1/q,expected=total*p,sd=Math.sqrt(total*p*(1-p)),confidence=Math.min(1,Math.sqrt(total/50));g.forEach(x=>{let score=0;if(x.k===min&&sd>0){const deficitZ=Math.max(0,(expected-x.k)/sd);score=Math.max(0,deficitZ-.20)*confidence}const info={...x,familyTotal:total,familyExpected:expected,score};byKey.set(family+'|'+x.name,info);if(score>0)familyCandidates.push(info)})}familyCandidates.sort((a,b)=>b.score-a.score||a.name.localeCompare(b.name));let betRank=0;familyCandidates.forEach(x=>{x.active=x.score>=.45;if(x.active&&betRank<3)x.rank=++betRank;else x.rank=0;x.level=x.score>=1.35?3:x.score>=.90?2:x.score>=.45?1:0});const counts=countsFor(sample),expectedPocket=n*FAIR,sdPocket=n?Math.sqrt(n*FAIR*(1-FAIR)):0,confidencePocket=n?Math.min(1,Math.sqrt(n/76)):0,defs=categoryDefs().filter(d=>d.family!=='Zeros'),numbers=new Map(),ranked=[];for(const pocket of POCKETS){const matches=[];if(pocket!=='0'&&pocket!=='00')for(const d of defs){if(!d.test(pocket))continue;const ci=byKey.get(d.family+'|'+d.name);if(ci&&ci.active)matches.push(ci)}const indivZ=sdPocket?Math.max(0,(expectedPocket-counts[pocket])/sdPocket):0,individual=Math.max(0,indivZ-.40)*.30*confidencePocket,region=matches.reduce((a,m)=>a+m.score,0),overlapBonus=matches.length>=2?.14*(matches.length-1):0,score=region+individual+overlapBonus,info={pocket,score,individual,matches,rank:0,level:0,active:false};numbers.set(pocket,info);ranked.push(info)}ranked.sort((a,b)=>b.score-a.score||Number(a.pocket==='00'?37:a.pocket)-Number(b.pocket==='00'?37:b.pocket));let r=0;for(const x of ranked){if(n<18||x.score<.90||r>=6)break;x.active=true;x.rank=++r;const rel=ranked[0].score?x.score/ranked[0].score:0;x.level=(x.rank<=2&&x.score>=2.2)||rel>=.82?3:(x.rank<=4&&x.score>=1.5)||rel>=.63?2:1}return{bets:byKey,familyCandidates,numbers,ranked,n,sample}}
function displayNumberModel(){const base=opportunityModel(),wm=wheelModel(),numbers=new Map(),ranked=[];for(const pocket of POCKETS){const bi=base.numbers.get(pocket),boardScore=bi?bi.score:0,wheelScore=wm.support.get(pocket)||0,score=boardScore+.75*wheelScore,info={pocket,score,boardScore,wheelScore,rank:0,level:0,active:false,matches:bi?bi.matches:[],individual:bi?bi.individual:0};numbers.set(pocket,info);ranked.push(info)}ranked.sort((a,b)=>b.score-a.score||b.wheelScore-a.wheelScore||b.boardScore-a.boardScore||WHEEL_INDEX.get(a.pocket)-WHEEL_INDEX.get(b.pocket));let r=0;for(const x of ranked){if(base.n<18||x.score<.90||r>=6)break;x.active=true;x.rank=++r;const rel=ranked[0].score?x.score/ranked[0].score:0;x.level=(x.rank<=2&&rel>=.82)?3:(x.rank<=4&&rel>=.63)?2:1}return{numbers,ranked,base,wheel:wm}}
function shortBetName(name){return({'Dozen 1':'1st12','Dozen 2':'2nd12','Dozen 3':'3rd12','Column 1':'C1','Column 2':'C2','Column 3':'C3'})[name]||name.toUpperCase()}function compact(n){return n>999?'999+':String(n)}
function makeNum(v){const b=document.createElement('button');b.className='num '+pocketClass(v);b.dataset.pocket=v;b.innerHTML=`<span>${v}</span><span class="cnt"></span><span class="gap"></span>`;b.addEventListener('click',()=>add(v));return b}function makeBoard(){['0','00'].forEach(v=>el.zero.appendChild(makeNum(v)));for(let i=1;i<=36;i++)el.board.appendChild(makeNum(String(i)))}
function render(){const c=countsFor(outcomes),dm=displayNumberModel(),m=dm.base,last=outcomes.at(-1)||'—',seen=POCKETS.filter(p=>c[p]>0).length;el.status.innerHTML=`<b>${outcomes.length}</b> spins · board <b>${Math.min(outcomes.length,100)}</b> · wheel <b>${Math.min(outcomes.length,20)}</b> · last <b>${last}</b> · <b>${seen}/38</b> seen`;
POCKETS.forEach(p=>{const b=document.querySelector(`[data-pocket="${p}"]`),x=dm.numbers.get(p);b.classList.remove('opp1','opp2','opp3','last');b.querySelectorAll('.rank').forEach(n=>n.remove());b.querySelector('.cnt').textContent=c[p]?compact(c[p]):'';b.querySelector('.gap').textContent=outcomes.length?'g '+compact(gapFor(p)):'';if(last===p)b.classList.add('last');if(x&&x.active){b.classList.add('opp'+x.level);if(x.rank<=3){const r=document.createElement('span');r.className='rank';r.textContent='★'+x.rank;b.appendChild(r)}}b.title=x?`${p}: combined ${x.score.toFixed(2)} = board ${x.boardScore.toFixed(2)} + wheel contribution ${(0.75*x.wheelScore).toFixed(2)}`:''});
document.querySelectorAll('.bet[data-family]').forEach(box=>{const x=m.bets.get(box.dataset.family+'|'+box.dataset.name);box.classList.remove('opp1','opp2','opp3');box.querySelectorAll('.betrank').forEach(n=>n.remove());if(!x)return;if(x.active&&x.level){box.classList.add('opp'+x.level);if(x.rank){const r=document.createElement('span');r.className='betrank';r.textContent='★'+x.rank;box.appendChild(r)}}const d=x.k-x.expected;box.querySelector('.betmeta').textContent=`${compact(x.k)} · Δ${d>=0?'+':''}${d.toFixed(1)}`});
if(m.n<18){el.topBets.textContent=`Building sample (${m.n}/18)`;el.topBets.classList.add('muted');el.topNumbers.textContent='—';el.topNumbers.classList.add('muted')}else{const bets=m.familyCandidates.filter(x=>x.active).slice(0,3),nums=dm.ranked.filter(x=>x.active).slice(0,5);el.topBets.textContent=bets.length?bets.map((x,i)=>`★${i+1} ${shortBetName(x.name)}`).join(' · '):'No notable disparity';el.topBets.classList.toggle('muted',!bets.length);el.topNumbers.textContent=nums.length?nums.map(x=>x.pocket).join(' · '):'No strong overlap';el.topNumbers.classList.toggle('muted',!nums.length)}
el.history.innerHTML='';outcomes.slice(-80).reverse().forEach(v=>{const d=document.createElement('div');d.className='chip '+pocketClass(v);d.textContent=v;el.history.appendChild(d)});if(!outcomes.length)el.history.innerHTML='<span style="color:var(--muted);font-size:.6rem">No spins yet.</span>';
el.why.innerHTML='';if(m.n<18){el.why.innerHTML='<div class="whyitem"><b>Building combined sample</b><p>Old v1.9.3 ranking begins after 18 board-window spins.</p></div>'}else{const picks=dm.ranked.filter(x=>x.active).slice(0,3);if(picks.length)picks.forEach((x,i)=>{const d=document.createElement('div');d.className='whyitem';d.innerHTML=`<b>★${i+1} ${x.pocket} · ${x.score.toFixed(2)}</b><p>Board ${x.boardScore.toFixed(2)} + wheel support ${x.wheelScore.toFixed(2)}. Same BOTH-mode formula as v1.9.3.</p>`;el.why.appendChild(d)});else el.why.innerHTML='<div class="whyitem"><b>No strong combined opportunity</b><p>The old thresholds are not currently met.</p></div>'}}
function importData(){const text=prompt('Paste JSON export or a sequence like: 17, 00, 3, 22, 0, 14');if(text==null)return;let vals=[];try{const j=JSON.parse(text);vals=Array.isArray(j)?j:(j&&Array.isArray(j.outcomes)?j.outcomes:[])}catch{vals=text.split(/[\s,;|]+/)}vals=vals.map(String).filter(Boolean);const bad=vals.filter(v=>!valid(v));if(bad.length)return alert('Invalid: '+bad.slice(0,10).join(', '));if(vals.length&&confirm(`Replace current session with ${vals.length} spins?`)){outcomes=vals;save();render()}}function exportData(){const blob=new Blob([JSON.stringify({app:'American Roulette Tracker',version:'1.9.4-boardboth-oldlogic-test',exported:new Date().toISOString(),outcomes},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='roulette-session.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
makeBoard();load();render();$('undo').onclick=undo;$('clear').onclick=()=>{if(outcomes.length&&confirm(`Clear all ${outcomes.length} spins?`)){outcomes=[];save();render()}};$('add').onclick=()=>add(el.quick.value);el.quick.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();add(el.quick.value)}});$('import').onclick=importData;$('export').onclick=exportData;
})();
</script>
</body>
</html>
