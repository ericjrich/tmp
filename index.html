<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>American Roulette Tracker v1.9.5 Test</title><style>
:root{color-scheme:dark;--b:#0c1013;--p:#141a1f;--p2:#1a2228;--t:#f4f7f8;--m:#a8b2b8;--l:#2b363d;--g:#ffe08a}*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--t);font-family:system-ui}.app{max-width:900px;margin:auto;padding:5px}.top{display:flex;justify-content:space-between;align-items:center;gap:5px;flex-wrap:wrap}.top h1{font-size:.95rem;margin:0}.v{font-size:.55em;border:1px solid #50606a;border-radius:99px;padding:2px 5px}.a{display:flex;gap:3px}.btn{border:1px solid var(--l);background:var(--p2);color:var(--t);border-radius:7px;padding:5px 8px}.panel{background:var(--p);border:1px solid var(--l);border-radius:9px;padding:5px;margin-top:5px}.status{text-align:center;color:var(--m);font-size:.6rem;margin-bottom:4px}.summary{display:grid;grid-template-columns:64px 1fr;gap:2px 5px;border:1px solid #805f2780;background:#211b13;border-radius:7px;padding:4px 5px;font-size:.54rem;margin-bottom:4px}.sl{color:#ffd98a;font-weight:900}.sv{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.muted{color:var(--m)}.zero{display:grid;grid-template-columns:repeat(2,1fr);gap:3px;margin-bottom:3px}.board{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}.num{position:relative;height:36px;border:1px solid #ffffff30;border-radius:6px;color:#fff;font-weight:850;font-size:.9rem}.red{background:#a71922}.black{background:#111}.green{background:#087b4f}.last{outline:2px solid #fff}.opp1{border-color:#d9a443!important;box-shadow:0 0 7px #d9902555}.opp2{border-color:#ffc45d!important;box-shadow:0 0 10px #ff9b2d88}.opp3{border:2px solid var(--g)!important;box-shadow:0 0 14px #ff9910aa}.rank,.badge{position:absolute;top:1px;border-radius:99px;padding:0 3px;font-size:.42rem;line-height:11px}.rank{left:2px;background:#5b3b09d9;border:1px solid #ffd270cc}.badge{right:2px;background:#6a450bbf;border:1px solid #ffd270aa}.cnt{position:absolute;right:3px;top:2px;font-size:.45rem}.gap{position:absolute;left:3px;bottom:2px;font-size:.42rem;color:#ddd}.bets{display:grid;gap:3px;margin-top:4px}.r3{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}.r6{display:grid;grid-template-columns:repeat(6,1fr);gap:2px}.bet{position:relative;min-height:34px;border:1px solid var(--l);border-radius:6px;background:#10161b;color:#fff;font-size:.52rem;font-weight:800}.bet.red{background:#68151b}.bet.black{background:#111}.meta{display:block;color:var(--m);font-size:.43rem;font-weight:500}.signal{border:2px solid var(--g)!important;box-shadow:0 0 14px #ffae3d88}.cold1{border-color:#7556b9!important}.cold2{border-color:#a17aff!important;box-shadow:0 0 8px #8e68ff55}.cold3{border:2px solid #cbb4ff!important;box-shadow:0 0 12px #9e77ff88}.coldbadge{background:#53398bbf;border-color:#bda3ff}.note{font-size:.49rem;color:var(--m);text-align:center;margin-top:4px}.note b{color:#ffd98a}.controls{display:grid;grid-template-columns:1fr auto;gap:4px;margin-top:4px}.controls input{min-width:0;background:#0f1418;color:#fff;border:1px solid var(--l);border-radius:7px;padding:7px;font-size:16px}.hist{display:flex;gap:4px;overflow:auto}.chip{flex:0 0 auto;width:27px;height:27px;border-radius:50%;display:grid;place-items:center;font-size:.66rem;font-weight:800}.why{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}.w{border:1px solid var(--l);border-radius:7px;padding:4px;background:#0f1418}.w b{font-size:.61rem}.w p{margin:2px 0 0;color:var(--m);font-size:.49rem}@media(max-width:620px){.why{grid-template-columns:1fr}.r6 .bet{font-size:.45rem}.top h1{font-size:.86rem}}

logic.</div><div class="controls"><input id="q" inputmode="numeric" placeholder="00, 0–36 then Enter"><button class="btn" id="add">Add</button></div></div><div class="panel"><div class="hist" id="hist"></div></div><div class="panel"><div class="why" id="why"></div></div></div><script>
(()=>{'use strict';const KEY='ejr-american-roulette-tracker-v1',RED=new Set([1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36].map(String)),P=['0','00',...Array.from({length:36},(_,i)=>''+(i+1))],MISS=26/38;let o=[];const $=x=>document.getElementById(x),E={z:$('zero'),b:$('board'),st:$('status'),s50:$('s50'),s13:$('s13'),sn:$('sn'),h:$('hist'),w:$('why'),q:$('q')};const cls=v=>v==='0'||v==='00'?'green':RED.has(v)?'red':'black',ok=v=>/^(00|0|[1-9]|[12][0-9]|3[0-6])$/.test(v),save=()=>localStorage.setItem(KEY,JSON.stringify(o));try{o=(JSON.parse(localStorage.getItem(KEY)||'[]')||[]).map(String).filter(ok)}catch{}
const F=[{f:'K',a:['R','B'],side:v=>v==='0'||v==='00'?null:RED.has(v)?'R':'B',hit:(n,v)=>n==='R'?RED.has(v):v!=='0'&&v!=='00'&&!RED.has(v)},{f:'P',a:['O','E'],side:v=>v==='0'||v==='00'?null:+v%2?'O':'E',hit:(n,v)=>v!=='0'&&v!=='00'&&(n==='O'?+v%2===1:+v%2===0)},{f:'R',a:['L','H'],side:v=>+v>=1&&+v<=18?'L':+v>=19&&+v<=36?'H':null,hit:(n,v)=>n==='L'?+v>=1&&+v<=18:+v>=19&&+v<=36}],T=[{f:'D',n:'D1',s:'1st12',hit:v=>+v>=1&&+v<=12},{f:'D',n:'D2',s:'2nd12',hit:v=>+v>=13&&+v<=24},{f:'D',n:'D3',s:'3rd12',hit:v=>+v>=25&&+v<=36},{f:'C',n:'C1',s:'C1',hit:v=>v!=='0'&&v!=='00'&&(+v-1)%3===0},{f:'C',n:'C2',s:'C2',hit:v=>v!=='0'&&v!=='00'&&(+v-2)%3===0},{f:'C',n:'C3',s:'C3',hit:v=>v!=='0'&&v!=='00'&&+v%3===0}];
function sig(d){let rs=null,rl=0,a=null;for(let i=0;i<o.length;i++){let s=d.side(o[i]);if(a){a.age++;if(s===a.t){a=null;rs=s;rl=1}else if(s===a.src&&a.open)a.run++;else if(!s)a.open=false}else{if(!s){rs=null;rl=0;continue}if(s===rs)rl++;else{rs=s;rl=1}if(rl>=5)a={src:s,t:d.a[0]===s?d.a[1]:d.a[0],run:rl,open:true,age:0,w:2}}}return{...d,a,rs,rl}}function cw(g){if(g<5)return 0;return Math.min(1.25,.25+.42*Math.log(Math.pow(MISS,5)/Math.pow(MISS,g)))}function cold(){return T.map(d=>{let g=o.length;for(let i=o.length-1,x=0;i>=0;i--,x++)if(d.hit(o[i])){g=x;break}return{...d,g,w:cw(g),on:g>=5,l:g>=10?3:g>=7?2:g>=5?1:0,p:Math.pow(MISS,g)}})}function gap(p){for(let i=o.length-1,g=0;i>=0;i--,g++)if(o[i]===p)return g;return o.length}function tie(p){let a=o.slice(-100),n=a.length,k=a.filter(x=>x===p).length,e=n/38,sd=Math.sqrt(n*(1/38)*(37/38));return sd?Math.max(0,(e-k)/sd)*.15:0}function name(n){return{R:'RED',B:'BLACK',O:'ODD',E:'EVEN',L:'LOW',H:'HIGH'}[n]||n}function model(){let ss=F.map(sig),as=ss.filter(x=>x.a),cc=cold(),ac=cc.filter(x=>x.on),r=P.map(p=>{let s=0,c=0,sm=[],cm=[];if(p!=='0'&&p!=='00'){for(const x of as)if(x.hit(x.a.t,p)){s+=x.a.w;sm.push(x)}for(const x of ac)if(x.hit(p)){c+=x.w;cm.push(x)}}return{p,s,c,t:tie(p),g:gap(p),sm,cm,score:s+c+tie(p),rank:0}});r.sort((a,b)=>b.score-a.score||b.s-a.s||b.c-a.c||b.t-a.t||b.g-a.g||(+a.p)-(+b.p));if(as.length||ac.length){let k=0;for(const x of r){if(x.p==='0'||x.p==='00'||x.score<=0)continue;x.rank=++k;if(k===3)break}}return{ss,as,cc,ac,r}}
function mk(v){let b=document.createElement('button');b.className='num '+cls(v);b.dataset.p=v;b.innerHTML=`<span>${v}</span><span class="cnt"></span><span class="gap"></span>`;b.onclick=()=>add(v);return b}['0','00'].forEach(v=>E.z.appendChild(mk(v)));for(let i=1;i<=36;i++)E.b.appendChild(mk(''+i));function add(v){v=(''+v).trim();if(!ok(v))return;o.push(v);save();render();E.q.value=''}function render(){let m=model(),last=o.at(-1)||'—',ct=Object.fromEntries(P.map(p=>[p,0]));o.forEach(v=>ct[v]++);E.st.innerHTML=`<b>${o.length}</b> spins · last <b>${last}</b> · <b>${P.filter(p=>ct[p]).length}/38</b> seen`;P.forEach(p=>{let b=document.querySelector(`[data-p="${p}"]`),x=m.r.find(q=>q.p===p);b.classList.remove('opp1','opp2','opp3','last');b.querySelectorAll('.rank').forEach(n=>n.remove());b.querySelector('.cnt').textContent=ct[p]||'';b.querySelector('.gap').textContent=o.length?'g '+gap(p):'';if(p===last)b.classList.add('last');if(x.rank){b.classList.add('opp'+(4-x.rank));let z=document.createElement('span');z.className='rank';z.textContent='★'+x.rank;b.appendChild(z)}});document.querySelectorAll('.bet').forEach(b=>{b.classList.remove('signal','cold1','cold2','cold3');b.querySelectorAll('.badge').forEach(x=>x.remove());let f=b.dataset.f,n=b.dataset.n,meta=b.querySelector('.meta');if(['K','P','R'].includes(f)){let s=m.ss.find(x=>x.f===f);if(s.a&&s.a.t===n){b.classList.add('signal');let z=document.createElement('span');z.className='badge';z.textContent='BET';b.appendChild(z);meta.textContent=`from ${name(s.a.src)} ${s.a.run}+`}else if(s.a&&s.a.src===n)meta.textContent=`streak ${s.a.run}`;else if(s.rs===n&&s.rl>1)meta.textContent=`streak ${s.rl}`;else meta.textContent=''}else{let c=m.cc.find(x=>x.f===f&&x.n===n);if(c.on){b.classList.add('cold'+c.l);let z=document.createElement('span');z.className='badge coldbadge';z.textContent='C'+c.g;b.appendChild(z)}meta.textContent=c.g?`cold ${c.g} · ${(100*c.p).toFixed(c.p<.1?1:0)}%`:'hit now'}});let a=m.as.map(x=>`${name(x.a.t)} ← ${name(x.a.src)} ${x.a.run}+`).join(' · ');E.s50.textContent=a||'No unresolved 5+ streak';E.s50.classList.toggle('muted',!a);let c=m.ac.sort((a,b)=>b.w-a.w).slice(0,4).map(x=>`${x.s} c${x.g}`).join(' · ');E.s13.textContent=c||'Waiting for cold 5+';E.s13.classList.toggle('muted',!c);let picks=m.r.filter(x=>x.rank).sort((a,b)=>a.rank-b.rank);E.sn.textContent=picks.length?picks.map(x=>`★${x.rank} ${x.p}`).join(' · '):'Waiting for signal/helper';E.sn.classList.toggle('muted',!picks.length);E.h.innerHTML='';o.slice(-80).reverse().forEach(v=>{let d=document.createElement('div');d.className='chip '+cls(v);d.textContent=v;E.h.appendChild(d)});E.w.innerHTML='';if(picks.length)picks.forEach(x=>{let d=document.createElement('div');d.className='w';d.innerHTML=`<b>★${x.rank} ${x.p} · ${x.score.toFixed(2)}</b><p>50/50: ${x.sm.map(y=>name(y.a.t)).join(' + ')||'none'}. 1/3: ${x.cm.map(y=>y.s+' cold '+y.g).join(' + ')||'none'}. Board tie: ${x.t.toFixed(2)}.</p>`;E.w.appendChild(d)});else E.w.innerHTML='<div class="w"><b>Waiting for pressure</b><p>★ numbers appear when a 50/50 signal is open or a dozen/column reaches cold 5.</p></div>'}
function imp(){let t=prompt('Paste JSON or roulette numbers');if(t==null)return;let v=[];try{let j=JSON.parse(t);v=Array.isArray(j)?j:j.outcomes||[]}catch{v=t.split(/[\s,;|]+/)}v=v.map(String).filter(Boolean);if(v.some(x=>!ok(x)))return alert('Invalid value');if(v.length&&confirm(`Replace with ${v.length} spins?`)){o=v;save();render()}}function exp(){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify({version:'1.9.5-streak-cold-test',outcomes:o},null,2)],{type:'application/json'}));a.href=u;a.download='roulette-session.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),500)}render();$('add').onclick=()=>add(E.q.value);E.q.onkeydown=e=>{if(e.key==='Enter')add(E.q.value)};$('undo').onclick=()=>{if(o.length){o.pop();save();render()}};$('clear').onclick=()=>{if(o.length&&confirm('Clear all spins?')){o=[];save();render()}};$('import').onclick=imp;$('export').onclick=exp})();
