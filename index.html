<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lily's Chore Checklist</title>
<style>
  :root {
    color-scheme: dark;
    --bg:#111318; --panel:#1a1d24; --panel2:#222631; --panel3:#181b22;
    --text:#f5f7fb; --muted:#aeb6c5; --line:#353b49;
    --accent:#8ab4f8; --good:#72d69c; --bad:#ff7b7b;
  }
  * { box-sizing:border-box; }
  body {
    margin:0; min-height:100vh; background:var(--bg); color:var(--text);
    font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  }
  .wrap { max-width:760px; margin:0 auto; padding:22px 16px 60px; }
  .card {
    background:var(--panel); border:1px solid var(--line); border-radius:18px;
    padding:20px; box-shadow:0 10px 32px rgba(0,0,0,.25);
  }
  h1 { margin:0 0 8px; font-size:clamp(26px,5vw,38px); }
  .sub { color:var(--muted); margin-bottom:18px; }
  .lock { max-width:420px; margin:10vh auto 0; }
  label { display:block; }
  .pwlabel { margin:12px 0 7px; font-weight:700; }
  input[type=password] {
    width:100%; padding:14px 16px; border-radius:12px; border:1px solid var(--line);
    background:#101218; color:var(--text); font-size:20px; letter-spacing:.16em;
  }
  button {
    border:0; border-radius:12px; padding:13px 16px; font-size:16px; font-weight:800;
    cursor:pointer; background:var(--accent); color:#0b1220;
  }
  .unlock { width:100%; margin-top:12px; }
  .error { min-height:24px; color:var(--bad); margin-top:10px; }
  .toolbar {
    display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin:12px 0 18px;
  }
  .toolbar button { background:var(--panel2); color:var(--text); border:1px solid var(--line); }
  .progress {
    flex:1 1 220px; height:12px; border-radius:999px; overflow:hidden;
    background:#0d0f14; border:1px solid var(--line);
  }
  .bar { height:100%; width:0%; background:var(--good); transition:width .2s ease; }
  .count { color:var(--muted); font-weight:700; min-width:110px; text-align:right; }
  .item {
    background:var(--panel2); border:1px solid var(--line); border-radius:15px;
    padding:14px; margin:10px 0;
  }
  .checkrow { display:flex; align-items:flex-start; gap:12px; cursor:pointer; }
  .checkrow input {
    width:24px; height:24px; margin:1px 0 0; accent-color:var(--good); flex:none;
  }
  .title { font-size:18px; font-weight:850; line-height:1.25; }
  .checkrow.done .title, .subrow.done .subtext {
    text-decoration:line-through; opacity:.65;
  }
  .sublist { margin:10px 0 0 36px; display:grid; gap:7px; }
  .subrow {
    display:flex; align-items:flex-start; gap:10px; background:var(--panel3);
    border:1px solid rgba(255,255,255,.05); border-radius:10px; padding:9px 10px;
    cursor:pointer;
  }
  .subrow input {
    width:20px; height:20px; margin:1px 0 0; accent-color:var(--good); flex:none;
  }
  .subtext { color:var(--muted); line-height:1.35; }
  .weightnote {
    color:var(--muted); font-size:12px; margin:8px 0 0 36px;
  }
  .footer { color:var(--muted); font-size:13px; margin-top:18px; text-align:center; }
  .hidden { display:none !important; }
</style>
</head>
<body>
<div class="wrap">
  <section id="lockScreen" class="card lock">
    <h1>🔒 Lily's Checklist</h1>
    <div class="sub">Enter the code to unlock the chore list.</div>
    <label class="pwlabel" for="pw">Code</label>
    <input id="pw" type="password" inputmode="numeric" autocomplete="off" autofocus>
    <button class="unlock" id="unlockBtn">Unlock</button>
    <div id="error" class="error"></div>
  </section>

  <section id="app" class="hidden">
    <div class="card">
      <h1 id="title"></h1>
      <div id="subtitle" class="sub"></div>
      <div class="toolbar">
        <div class="progress"><div id="bar" class="bar"></div></div>
        <div id="count" class="count"></div>
        <button id="resetBtn" type="button">Reset checks</button>
        <button id="lockBtn" type="button">Lock</button>
      </div>
      <div id="list"></div>
      <div class="footer">
        Each numbered chore has equal weight. Sub-items divide that chore's share of the progress bar.
      </div>
    </div>
  </section>
</div>

<script>
const ENC = {
  salt: "e/d5uAR0yW2TnOZPQbAmAA==",
  iv: "1blQm3we+303qJph",
  data: "DbTEKCqjqNHrC/vDxqw+ofwXhhHO7+9Ncvk8VHLgpOroMHZMoFCskidBIyqa0DcyQBv5peBMRpwbQhoWHy7MWRZLX6A03gRIuyujsqPwQmlH+Rv3IiXxBsLrsZqhnYm8Lz8QnVxWeBGlrRqEh6W5lhIWn1cF8KMeQsyf3x8IE+noNMiI1KdpHTFimh7Lx93utXIetJgCB3fedFM2nmx87faEQnx1nH6ZqmvJGyein8u+mN1/7H6UxieaX5zYh9pOM71Jf5Frf+4XhWfdtyxpThhuiCEol828W+fDnJcHkZ2mqJ7WufOvE1st2lnWhqXymgIAdeIFRPwB3Z9TxGg4ynZMWdIuROhPMijRIZA6HE9P0l1z8k05saajEwDu+u5hWu42L/GIKOKQRshtwIZGpW3icehdKI/0MJWvA3AW5G77tpciDw993oXbiwenulN3jgZG+5amPb4MkvfY7YcUfv08GbYBnXrIVv8EsMtBFMvODaYf8yHPxKXXYc9Mw6+RwTfSiL2ccIxdB8odiCafFyTNSu+ISMHYmAER0snFL1aAK04ti7KjYKmd1ts4+rMBSF/RvcHRIGi/CjOj5JCLo6+aDviP5VJKTbMy37ptM5CRIOo33U8xaGJxm245nmLO2oyDCuOxaUEU9g9U4G5vJ/ujmEFRJfFf3FNoor/DUP6boXBoB1trbyWl5KA0LImj7tjelyoo7Q+2Glcmqhg0rPj5rhmoorJdl+q8LOjm+IgN+u6l3GN03AR0fumADsZutMhShXe5loaKgF9JdkLJfeQE7mqReyPZSxqFDY72fnzlqCZDf745Z+QFLFbU+Ghu4+RdrCwqgTwTf0Ci3FWAp6aQUbgrpCQMwX+gumBtKrpDodiOcTmoOts8LLdbqEn+SNxdv56LPooRvOBf0qItOb8BHpnhmllVYJur+kxYev+LKWez+0DSNA5UhUafg0MsgcqRhrXf3r9WpEx0iRnf1N21maLwstGn3gHcIHrAt5Ghok41KoRfCezTZdkVRg3SY0YkIqsrEgdcQ0Ga6rfYJF7DbAKp/uHWGdFqQXHNVHU+grhy4S5a/o1NOkr19HGDt0YYSQgh5l9TvasgyH2g8XDzS82bvBvyayhI8dGSLVDmx92uOFizyu/9WLby/1tyip4yxcfxJyo+1vhjp2ykGiNKVxkQIJYAMvVDkdAsKP76iRUSf0e8Wl/8yT8IY4huVlFFDGSXO0YpqIYooYq7SQp2UNmAWqDohV6gecYjCTmVR6E3i/9mKfd7At94M/rUkUYmlEyOLN5OkeaQZiUmOSbpbYGUGeK3EVZ03k19C3t74aCkHQwYKKkQTL1EW9l4hGo825KnzIvvvkuL7iqbZncDtNJWe5Vz3vURPrVulk/6UsuRu29SYJBECFJFBqNa92gXbbggh2aom/t6xpL3L2lgx8VZYGRI4uXDwy8qeRP2fFTBxFBxxDTruM3e8H7MHEAbh1R9RaqO+zswIFdEheu+OJVRXz/JhSU1UO7STbhSjYup6JMPuIPUEw8fBUIZburu4z3ebGmoA2DyZsSyKhJtHzPria3FrW3nk7/2ZVFvNwd9X3vZXsB8Huyiikzw+4k9OaAgJ9trMz/J8HeE40ERMNz+5CZvLASxBhw+8KXComUu5plfRRG90xWY2D5KkV8P4gfb",
  iterations: 250000
};

const $ = id => document.getElementById(id);
const stateKey = "lily_chore_checks_v3";
let payload = null;

function b64ToBytes(s) {
  const bin = atob(s);
  return Uint8Array.from(bin, c => c.charCodeAt(0));
}

async function decrypt(pass) {
  const enc = new TextEncoder();
  const keyMaterial = await crypto.subtle.importKey(
    "raw", enc.encode(pass), "PBKDF2", false, ["deriveKey"]
  );
  const key = await crypto.subtle.deriveKey(
    {
      name:"PBKDF2", salt:b64ToBytes(ENC.salt),
      iterations:ENC.iterations, hash:"SHA-256"
    },
    keyMaterial,
    {name:"AES-GCM", length:256},
    false,
    ["decrypt"]
  );
  const plain = await crypto.subtle.decrypt(
    {name:"AES-GCM", iv:b64ToBytes(ENC.iv)},
    key,
    b64ToBytes(ENC.data)
  );
  return JSON.parse(new TextDecoder().decode(plain));
}

function loadChecks() {
  try { return JSON.parse(localStorage.getItem(stateKey) || "{}"); }
  catch { return {}; }
}

function saveChecks(checks) {
  localStorage.setItem(stateKey, JSON.stringify(checks));
}

function setChecked(key, checked, row) {
  const checks = loadChecks();
  checks[key] = checked;
  saveChecks(checks);
  row.classList.toggle("done", checked);
  syncMainIndicators(checks);
  updateProgress(checks);
}

function choreFraction(item, i, checks) {
  const mainKey = `main-${i}`;

  // Checking the main box means this whole numbered chore is complete.
  if (checks[mainKey]) return 1;

  const details = item.details || [];

  // No sub-items: main checkbox is the only progress source.
  if (!details.length) return 0;

  // With sub-items, they divide the chore's one full share equally.
  let checkedSubs = 0;
  details.forEach((_, j) => {
    if (checks[`sub-${i}-${j}`]) checkedSubs++;
  });

  return checkedSubs / details.length;
}

function overallProgress(checks) {
  if (!payload.items.length) return 0;
  let total = 0;
  payload.items.forEach((item, i) => {
    total += choreFraction(item, i, checks);
  });
  return total / payload.items.length;
}

function syncMainIndicators(checks) {
  payload.items.forEach((item, i) => {
    const main = document.querySelector(`[data-main-index="${i}"]`);
    if (!main) return;

    const details = item.details || [];
    if (!details.length) {
      main.indeterminate = false;
      return;
    }

    const mainChecked = !!checks[`main-${i}`];
    const checkedSubs = details.filter((_, j) => !!checks[`sub-${i}-${j}`]).length;

    // Partial visual cue only. It does not change the stored main checkbox state.
    main.indeterminate = !mainChecked && checkedSubs > 0 && checkedSubs < details.length;
  });
}

function render() {
  $("title").textContent = payload.title;
  $("subtitle").textContent = payload.subtitle;

  const checks = loadChecks();
  const list = $("list");
  list.innerHTML = "";

  payload.items.forEach((item, i) => {
    const card = document.createElement("div");
    card.className = "item";

    const mainKey = `main-${i}`;
    const mainRow = document.createElement("label");
    mainRow.className = "checkrow" + (checks[mainKey] ? " done" : "");

    const mainCb = document.createElement("input");
    mainCb.type = "checkbox";
    mainCb.checked = !!checks[mainKey];
    mainCb.dataset.mainIndex = i;

    const title = document.createElement("div");
    title.className = "title";
    title.textContent = `${i+1}. ${item.title}`;

    mainRow.append(mainCb, title);
    card.append(mainRow);

    mainCb.addEventListener("change", () => {
      setChecked(mainKey, mainCb.checked, mainRow);
    });

    if (item.details?.length) {
      const sublist = document.createElement("div");
      sublist.className = "sublist";

      item.details.forEach((detail, j) => {
        const subKey = `sub-${i}-${j}`;
        const subRow = document.createElement("label");
        subRow.className = "subrow" + (checks[subKey] ? " done" : "");

        const subCb = document.createElement("input");
        subCb.type = "checkbox";
        subCb.checked = !!checks[subKey];

        const text = document.createElement("div");
        text.className = "subtext";
        text.textContent = detail;

        subRow.append(subCb, text);
        sublist.appendChild(subRow);

        subCb.addEventListener("change", () => {
          setChecked(subKey, subCb.checked, subRow);
        });
      });

      card.appendChild(sublist);

      const note = document.createElement("div");
      note.className = "weightnote";
      note.textContent = `${item.details.length} sub-item${item.details.length === 1 ? "" : "s"} share this chore's progress equally.`;
      card.appendChild(note);
    }

    list.appendChild(card);
  });

  syncMainIndicators(checks);
  updateProgress(checks);
}

function updateProgress(checks) {
  const fraction = overallProgress(checks);
  const percent = Math.round(fraction * 100);
  $("bar").style.width = `${fraction * 100}%`;
  $("count").textContent = `${percent}% complete`;
}

async function unlock() {
  $("error").textContent = "";
  const pass = $("pw").value;
  if (!pass) return;

  try {
    payload = await decrypt(pass);
    $("lockScreen").classList.add("hidden");
    $("app").classList.remove("hidden");
    render();
    $("pw").value = "";
  } catch {
    $("error").textContent = "Wrong code.";
    $("pw").select();
  }
}

$("unlockBtn").addEventListener("click", unlock);
$("pw").addEventListener("keydown", e => {
  if (e.key === "Enter") unlock();
});

$("resetBtn").addEventListener("click", () => {
  if (!payload) return;
  localStorage.removeItem(stateKey);
  render();
});

$("lockBtn").addEventListener("click", () => {
  payload = null;
  $("app").classList.add("hidden");
  $("lockScreen").classList.remove("hidden");
  $("pw").focus();
});
</script>
</body>
</html>
