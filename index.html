<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Protected HTML</title>
<style>
:root{color-scheme:dark;--panel:#151b22;--line:#303a44;--text:#f5f7fa;--muted:#aab4be;--accent:#76b7ff;--bad:#ff8585}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:18px;background:linear-gradient(180deg,#080b0f,#10161d);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,sans-serif}
.lock{width:min(430px,100%);padding:22px;border:1px solid var(--line);border-radius:18px;background:var(--panel);box-shadow:0 20px 70px #0008}
h1{margin:0 0 8px;font-size:1.45rem}p{margin:.45rem 0;color:var(--muted);line-height:1.4}
input{width:100%;min-height:52px;margin-top:12px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#0e141a;color:var(--text);font:inherit;font-size:16px}
button{width:100%;min-height:52px;margin-top:12px;border:0;border-radius:12px;background:var(--accent);color:#06101a;font:800 1rem system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;cursor:pointer;touch-action:manipulation}button:disabled{opacity:.55}
#msg{min-height:1.4em;margin-top:12px;color:var(--muted);word-break:break-word}#msg.bad{color:var(--bad)}.ver{margin-top:12px;text-align:center;font-size:.7rem;color:#77838d}
</style>
</head>
<body>
<main class="lock">
  <h1>🔒 Protected HTML</h1>
  <p>Enter the password to unlock this page.</p>
  <input id="pw" type="password" autocomplete="current-password" placeholder="Password" autofocus>
  <button id="unlock">Unlock</button>
  <div id="msg" aria-live="polite"></div>
  <div class="ver">e-htmlcrypt v1.1.1</div>
</main>

function b64(s){const x=atob(s),u=new Uint8Array(x.length);for(let i=0;i<x.length;i++)u[i]=x.charCodeAt(i);return u}
function join(a,b){const u=new Uint8Array(a.length+b.length);u.set(a);u.set(b,a.length);return u}
function equal(a,b){if(a.length!==b.length)return false;let x=0;for(let i=0;i<a.length;i++)x|=a[i]^b[i];return x===0}
async function derive(password){

async function unlock(){

    pw.value='';pw.disabled=false;btn.disabled=false;msg.textContent=reason;msg.className='bad';pw.focus();
