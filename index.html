<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Protected - rt.html</title>
<style>
:root{
  color-scheme:dark;
  --bg:#0b0e13;
  --panel:#151922;
  --line:#2b3340;
  --text:#f4f7fb;
  --muted:#aab4c2;
  --accent:#75a7ff;
  --bad:#ff8585;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:18px;
  background:linear-gradient(180deg,#090c10,#11161e);
  color:var(--text);
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Ubuntu,sans-serif;
}
.lock{
  width:min(430px,100%);
  padding:22px;
  border:1px solid var(--line);
  border-radius:18px;
  background:var(--panel);
  box-shadow:0 20px 70px #0008;
}
h1{margin:0 0 8px;font-size:1.4rem}
p{color:var(--muted);line-height:1.4}
input{
  width:100%;
  min-height:52px;
  padding:12px 14px;
  margin-top:10px;
  border:1px solid var(--line);
  border-radius:12px;
  background:#0f131a;
  color:var(--text);
  font:inherit;
}
button{
  width:100%;
  min-height:52px;
  margin-top:12px;
  border:0;
  border-radius:12px;
  background:var(--accent);
  color:#07101e;
  font:800 1rem system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  cursor:pointer;
}
button:disabled{opacity:.55;cursor:not-allowed}
#msg{min-height:1.4em;margin-top:12px;color:var(--muted)}
#msg.bad{color:var(--bad)}
</style>
</head>
<body>
<main class="lock">
  <h1>🔒 Protected HTML</h1>
  <p>Enter the password to open this page.</p>
  <input id="password" type="password" autocomplete="current-password" placeholder="Password" autofocus>
  <button id="unlock">Unlock</button>
  <div id="msg" aria-live="polite"></div>
</main>

  const pass = document.getElementById("password");
  const button = document.getElementById("unlock");
  const msg = document.getElementById("msg");

  function b64ToBytes(b64) {
    const binary = atob(b64);
    const out = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) out[i] = binary.charCodeAt(i);
    return out;
  }

  async function deriveKey(password, salt) {
    const material = await crypto.subtle.importKey(
      "raw",
      new TextEncoder().encode(password),
      "PBKDF2",
      false,
      ["deriveKey"]
    );

    return crypto.subtle.deriveKey(
      {
        name: "PBKDF2",
        salt,
        iterations: ITERATIONS,
        hash: "SHA-256"
      },
      material,
      { name: "AES-GCM", length: 256 },
      false,
      ["decrypt"]
    );
  }

  async function unlock() {
    const password = pass.value;
    if (!password) {
      msg.textContent = "Enter the password.";
      msg.className = "bad";
      pass.focus();
      return;
    }

    button.disabled = true;
    pass.disabled = true;
    msg.textContent = "Decrypting…";
    msg.className = "";

    try {
      const salt = b64ToBytes(SALT_B64);
      const iv = b64ToBytes(IV_B64);
      const cipher = b64ToBytes(CIPHER_B64);
      const key = await deriveKey(password, salt);

      const plainBuffer = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv },
        key,
        cipher
      );

      const originalHtml = new TextDecoder().decode(plainBuffer);

      /*
        Replace this locked document with the decrypted original in-place.
        No popup, iframe, Blob navigation, or new tab.
      */
      document.open();
      document.write(originalHtml);
      document.close();

    } catch (err) {
      msg.textContent = "Wrong password or damaged file.";
      msg.className = "bad";
      pass.value = "";
      pass.disabled = false;
      button.disabled = false;
      pass.focus();
    }
  }

  button.addEventListener("click", unlock);
  pass.addEventListener("keydown", e => {
    if (e.key === "Enter") unlock();
  });
})();
</script>
</body>
</html>
