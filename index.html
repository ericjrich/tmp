<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>American Roulette Tracker v1.10.0</title><style>
:root{color-scheme:dark;--b:#0c1013;--p:#141a1f;--p2:#1a2228;--t:#f4f7f8;--m:#a8b2b8;--l:#2b363d;--g:#ffe08a}*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--t);font-family:system-ui}.app{max-width:900px;margin:auto;padding:5px}.top{display:flex;justify-content:space-between;align-items:center;gap:5px;flex-wrap:wrap}.top h1{font-size:.95rem;margin:0}.v{font-size:.55em;border:1px solid #50606a;border-radius:99px;padding:2px 5px}.a{display:flex;gap:3px}.btn{border:1px solid var(--l);background:var(--p2);color:var(--t);border-radius:7px;padding:5px 8px}.panel{background:var(--p);border:1px solid var(--l);border-radius:9px;padding:5px;margin-top:5px}.status{text-align:center;color:var(--m);font-size:.6rem;margin-bottom:4px}.summary{display:grid;grid-template-columns:64px 1fr;gap:2px 5px;border:1px solid #805f2780;background:#211b13;border-radius:7px;padding:4px 5px;font-size:.54rem;margin-bottom:4px}.sl{color:#ffd98a;font-weight:900}.sv{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.muted{color:var(--m)}.zero{display:grid;grid-template-columns:repeat(2,1fr);gap:3px;margin-bottom:3px}.board{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}.num{position:relative;height:36px;border:1px solid #ffffff30;border-radius:6px;color:#fff;font-weight:850;font-size:.9rem}.red{background:#a71922}.black{background:#111}.green{background:#087b4f}.last{outline:2px solid #fff}.opp1{border-color:#d9a443!important;box-shadow:0 0 7px #d9902555}.opp2{border-color:#ffc45d!important;box-shadow:0 0 10px #ff9b2d88}.opp3{border:2px solid var(--g)!important;box-shadow:0 0 14px #ff9910aa}.rank,.badge{position:absolute;top:1px;border-radius:99px;padding:0 3px;font-size:.42rem;line-height:11px}.rank{left:2px;background:#5b3b09d9;border:1px solid #ffd270cc}.badge{right:2px;background:#6a450bbf;border:1px solid #ffd270aa}.cnt{position:absolute;right:3px;top:2px;font-size:.45rem}.gap{position:absolute;left:3px;bottom:2px;font-size:.42rem;color:#ddd}.bets{display:grid;gap:3px;margin-top:4px}.r3{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}.r6{display:grid;grid-template-columns:repeat(6,1fr);gap:2px}.bet{position:relative;min-height:34px;border:1px solid var(--l);border-radius:6px;background:#10161b;color:#fff;font-size:.52rem;font-weight:800}.bet.red{background:#68151b}.bet.black{background:#111}.meta{display:block;color:var(--m);font-size:.43rem;font-weight:500}.signal{border:2px solid var(--g)!important;box-shadow:0 0 14px #ffae3d88}.watch{border:1px dashed #d6b55c!important;box-shadow:0 0 8px #d6b55c33}.cold1{border-color:#7556b9!important}.cold2{border-color:#a17aff!important;box-shadow:0 0 8px #8e68ff55}.cold3{border:2px solid #cbb4ff!important;box-shadow:0 0 12px #9e77ff88}.coldbadge{background:#53398bbf;border-color:#bda3ff}.note{font-size:.49rem;color:var(--m);text-align:center;margin-top:4px}.note b{color:#ffd98a}.controls{display:grid;grid-template-columns:1fr auto;gap:4px;margin-top:4px}.controls input{min-width:0;background:#0f1418;color:#fff;border:1px solid var(--l);border-radius:7px;padding:7px;font-size:16px}.hist{display:flex;gap:4px;overflow:auto}.chip{flex:0 0 auto;width:27px;height:27px;border-radius:50%;display:grid;place-items:center;font-size:.66rem;font-weight:800}.why{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}.w{border:1px solid var(--l);border-radius:7px;padding:4px;background:#0f1418}.w b{font-size:.61rem}.w p{margin:2px 0 0;color:var(--m);font-size:.49rem}@media(max-width:620px){.why{grid-template-columns:1fr}.r6 .bet{font-size:.45rem}.top h1{font-size:.86rem}}
</style></head><body><div class="app"><div class="top"><h1>American Roulette Tracker <span class="v">v1.10.0</span></h1><div class="a"><a class="btn" href="test.html" target="_blank" rel="noopener" style="text-decoration:none">Sim</a><button class="btn" id="undo">Undo</button><button class="btn" id="export">Export</button><button class="btn" id="import">Import</button><button class="btn" id="clear">Clear</button></div></div><div class="panel"><div class="status" id="status"></div><div class="summary"><span class="sl">50/50</span><span class="sv muted" id="s50"></span><span class="sl">1/3</span><span class="sv muted" id="s13"></span><span class="sl">NUMBERS</span><span class="sv muted" id="sn"></span></div><div class="zero" id="zero"></div><div class="board" id="board"></div><div class="bets"><div class="r3"><button class="bet" data-f="D" data-n="D1">1st 12<span class="meta"></span></button><button class="bet" data-f="D" data-n="D2">2nd 12<span class="meta"></span></button><button class="bet" data-f="D" data-n="D3">3rd 12<span class="meta"></span></button></div><div class="r3"><button class="bet" data-f="C" data-n="C1">COL 1<span class="meta"></span></button><button class="bet" data-f="C" data-n="C2">COL 2<span class="meta"></span></button><button class="bet" data-f="C" data-n="C3">COL 3<span class="meta"></span></button></div><div class="r6"><button class="bet" data-f="R" data-n="L">1–18<span class="meta"></span></button><button class="bet" data-f="P" data-n="E">EVEN<span class="meta"></span></button><button class="bet red" data-f="K" data-n="R">RED<span class="meta"></span></button><button class="bet black" data-f="K" data-n="B">BLACK<span class="meta"></span></button><button class="bet" data-f="P" data-n="O">ODD<span class="meta"></span></button><button class="bet" data-f="R" data-n="H">19–36<span class="meta"></span></button></div></div><div class="note"><b>5-streak = WATCH.</b> <b>6+ = BET.</b> Cold 5–6 dozen/column = weak helper; cold 7+ = strong helper that can activate ★ numbers. History and structural relationships still refine every active prediction. Direct 1/3 betting is not recommended by default.</div><div class="controls"><input id="q" inputmode="numeric" placeholder="00, 0–36 then Enter"><button class="btn" id="add">Add</button></div></div><div class="panel"><div class="hist" id="hist"></div></div><div class="panel"><div class="why" id="why"></div></div></div><script src="test-engine.js"></script><script src="index-app.js"></script></body></html>
